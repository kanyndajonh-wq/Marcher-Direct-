<!DOCTYPE html>
<html>
<head>
  <title>Marcher-Direct - Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-lg shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Inscription</h2>
    <form>
      <input type="email" placeholder="Email" class="w-full p-2 border rounded mb-4">
      <input type="password" placeholder="Mot de passe" class="w-full p-2 border rounded mb-4">
      <button class="w-full bg-green-600 text-white p-2 rounded">S'inscrire</button>
    </form>
    
    <!-- LE LIEN QUE TU VOULAIS -->
    <div class="text-center mt-6 text-sm text-gray-600">
      J'ai déjà un compte ? 
      <a href="/login" class="text-green-600 font-semibold hover:underline ml-1">
        Se connecter
      </a>
    </div>
  </div>
</body>
</html>
